{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Sign In</title>
    <link rel="stylesheet" href="{% static 'onboarding/css/style.css' %}">
</head>
<body>

<div class="site">
<header class="header">
    <div class="site-name">Driver Onboarding</div>
</header>

<main class="auth-wrap">
<section class="auth-card">

    <h1>Driver Sign In</h1>
    <p class="subtitle">
        Sign in to resume your application or view its status.
    </p>

    {% if messages %}
    <div class="messages">
        {% for message in messages %}<p>{{ message }}</p>{% endfor %}
    </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div class="field">
            <label>Email Address</label>
            <input type="email" name="email" required>
        </div>

        <div class="field">
            <label>Password</label>
            <input type="password" id="login_password" name="password" required>

            <label class="show-password">
                <input type="checkbox" id="show_login_password">
                Show password
            </label>
        </div>

        <div class="actions">
            <a class="btn btn-light" href="{% url 'home' %}">Back</a>
            <button type="submit" class="btn btn-blue">Sign In</button>
        </div>
    </form>

</section>
</main>
</div>

<script>
const loginPassword = document.getElementById("login_password");
document.getElementById("show_login_password").addEventListener("change", function () {
    loginPassword.type = this.checked ? "text" : "password";
});
</script>

</body>
</html>
